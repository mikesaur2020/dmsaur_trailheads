<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMSaur Trailheads</title>
    <!--
      Single Page Apps for GitHub Pages — 404 redirect.
      GitHub Pages serves this file for any path it can't find on disk. Because the
      site is a client-rendered SPA, every deep link (and every browser refresh on
      one) lands here. We encode the requested path into a query string and bounce
      to '/', where the snippet in index.html restores the real URL for React Router.

      pathSegmentsToKeep = 0 because the site is served from the domain root
      (custom domain https://trailheads.dmsaur.com, Vite base '/'). If this ever
      moves to a project-pages subpath, set this to 1.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
